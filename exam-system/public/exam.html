<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ExamPortal — Student</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#070a12;--surface:#0f1420;--s2:#131929;--border:#1a2236;--accent:#4f8ef7;--purple:#7c3aed;--text:#e8ecf5;--muted:#5a6480;--success:#22c55e;--danger:#ef4444;--warn:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:100}
.logo{font-family:'Syne',sans-serif;font-size:18px;font-weight:800}.logo span{color:var(--accent)}
.hright{display:flex;align-items:center;gap:12px}
.chip{display:flex;align-items:center;gap:9px;background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:5px 14px 5px 7px;font-size:13px}
.av{width:28px;height:28px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;transition:opacity .15s}
.btn:hover{opacity:.8}
.btn-g{background:var(--s2);color:var(--text);border:1px solid var(--border)}
.btn-p{background:var(--accent);color:#fff}
.btn-d{background:var(--danger);color:#fff}
/* VIEWS */
.view{display:none}.view.on{display:block}
/* EXAM LIST */
.page{max-width:940px;margin:0 auto;padding:40px 24px}
.ptitle{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;margin-bottom:6px}
.psub{color:var(--muted);margin-bottom:30px;font-size:14px}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:18px}
.ecard{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:22px;cursor:pointer;transition:border-color .2s,transform .15s,box-shadow .2s;position:relative;overflow:hidden}
.ecard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--purple));opacity:0;transition:opacity .2s}
.ecard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 12px 40px rgba(79,142,247,.1)}
.ecard:hover::before{opacity:1}
.ecard.attempted{opacity:.6;cursor:default}.ecard.attempted:hover{transform:none;border-color:var(--border)}
.ecard.attempted::before{display:none}
.etitle{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:7px}
.edesc{color:var(--muted);font-size:13px;line-height:1.55;margin-bottom:14px}
.emeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tag{background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--muted)}
.done-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);border-radius:6px;padding:6px 12px;font-size:12px;color:#86efac}
.start-btn{width:100%;padding:11px;background:linear-gradient(135deg,var(--accent),var(--purple));border:none;border-radius:9px;color:#fff;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s}
.start-btn:hover{opacity:.9}
/* TAKING EXAM */
.exam-wrap{max-width:860px;margin:0 auto;padding:24px}
.topbar{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:70px;z-index:50;margin-bottom:24px}
.einfo .etname{font-family:'Syne',sans-serif;font-size:16px;font-weight:800}
.einfo .etmeta{color:var(--muted);font-size:12px;margin-top:2px}
.progwrap{flex:1}
.proglabel{font-size:12px;color:var(--muted);margin-bottom:5px}
.progbar{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.progfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--purple));border-radius:3px;transition:width .3s}
.timer{text-align:center;min-width:110px}
.tlabel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.tval{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;transition:color .3s}
.tval.warn{color:var(--warn)}.tval.crit{color:var(--danger);animation:pulse .6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.qblock{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:22px;margin-bottom:14px;transition:border-color .2s}
.qblock.answered{border-color:rgba(79,142,247,.3)}
.qnum{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:9px}
.qtext{font-size:15px;font-weight:500;line-height:1.65;margin-bottom:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:11px;background:var(--s2);border:1.5px solid var(--border);border-radius:10px;padding:12px 15px;cursor:pointer;font-size:14px;transition:all .15s;user-select:none}
.opt:hover{border-color:var(--accent);background:rgba(79,142,247,.05)}
.opt.sel{border-color:var(--accent);background:rgba(79,142,247,.1)}
.oletter{width:28px;height:28px;border-radius:8px;background:var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;transition:background .15s}
.opt.sel .oletter{background:var(--accent);color:#fff}
.subbar{background:var(--surface);border-top:1px solid var(--border);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;bottom:0;z-index:50}
.subinfo{font-size:14px;color:var(--muted)}.subinfo strong{color:var(--text)}
.sub-btn{padding:12px 32px;background:linear-gradient(135deg,var(--accent),var(--purple));border:none;border-radius:10px;color:#fff;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s}
.sub-btn:hover{opacity:.9}

/* ── RESULT VIEW ─────────────────────────────────────── */
.rpage{max-width:820px;margin:0 auto;padding:40px 24px}
.rscore-area{text-align:center;margin-bottom:36px}
.score-ring-outer{width:180px;height:180px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px;position:relative}
.score-ring-svg{position:absolute;top:0;left:0;width:180px;height:180px;transform:rotate(-90deg)}
.score-ring-inner{width:140px;height:140px;background:var(--surface);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
.rpct{font-family:'Syne',sans-serif;font-size:34px;font-weight:800}
.rlabel{font-size:11px;color:var(--muted);margin-top:2px}
.rstatus{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;margin-bottom:6px}
.rstatus.pass{color:var(--success)}.rstatus.fail{color:var(--danger)}
.rdetail{color:var(--muted);font-size:15px;margin-bottom:6px}
.grade-badge{display:inline-block;padding:6px 22px;border-radius:20px;font-family:'Syne',sans-serif;font-size:18px;font-weight:800;margin-top:8px}
.grade-A{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.3)}
.grade-B{background:rgba(79,142,247,.15);color:#93c5fd;border:1px solid rgba(79,142,247,.3)}
.grade-C{background:rgba(245,158,11,.15);color:#fcd34d;border:1px solid rgba(245,158,11,.3)}
.grade-D{background:rgba(245,158,11,.1);color:#fcd34d;border:1px solid rgba(245,158,11,.2)}
.grade-F{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
/* Stats row */
.rstats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.rstat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.rstat .rv{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:4px}
.rstat .rl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
/* Breakdown */
.bsection{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:24px}
.bhead{padding:16px 20px;border-bottom:1px solid var(--border);font-family:'Syne',sans-serif;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.bhead .bscore{font-size:13px;color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:400}
.bitem{padding:18px 20px;border-bottom:1px solid rgba(26,34,54,.5)}
.bitem:last-child{border-bottom:none}
.bitem-q{font-size:14px;font-weight:500;margin-bottom:12px;line-height:1.5}
.bitem-opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.bopt{padding:9px 13px;border-radius:8px;font-size:13px;border:1.5px solid var(--border);background:var(--s2);display:flex;align-items:center;gap:8px}
.bopt.correct{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3);color:#86efac}
.bopt.wrong{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3);color:#fca5a5}
.bopt.neutral{opacity:.5}
.bopt-letter{font-weight:700;font-size:12px}
.bitem-verdict{font-size:12px;display:flex;align-items:center;gap:6px}
.bitem-verdict.right{color:var(--success)}.bitem-verdict.wrong{color:var(--danger)}
.raction{display:flex;gap:12px;justify-content:center;margin-top:8px}
</style>
</head>
<body>

<header>
  <div class="logo">Exam<span>Portal</span></div>
  <div class="hright">
    <div class="chip"><div class="av" id="hAv">S</div><span id="hName">Student</span></div>
    <a href="/results.html" class="btn btn-g">📊 My Results</a>
    <button class="btn btn-g" onclick="logout()">Logout</button>
  </div>
</header>

<!-- LIST VIEW -->
<div class="view on" id="vList">
  <div class="page">
    <div class="ptitle">Available Exams</div>
    <div class="psub">Select an exam to start. Each exam can only be attempted once.</div>
    <div class="egrid" id="egrid"><p style="color:var(--muted)">Loading exams...</p></div>
  </div>
</div>

<!-- EXAM VIEW -->
<div class="view" id="vExam">
  <div class="exam-wrap">
    <div class="topbar">
      <div class="einfo">
        <div class="etname" id="etname">—</div>
        <div class="etmeta" id="etmeta">—</div>
      </div>
      <div class="progwrap">
        <div class="proglabel"><span id="pAns">0</span> of <span id="pTotal">0</span> answered</div>
        <div class="progbar"><div class="progfill" id="pFill" style="width:0%"></div></div>
      </div>
      <div class="timer">
        <div class="tlabel">Time Left</div>
        <div class="tval" id="timerDisp">00:00</div>
      </div>
    </div>
    <div id="qContainer"></div>
    <div class="subbar">
      <div class="subinfo">Answered: <strong id="sAns">0</strong> / <strong id="sTotal">0</strong></div>
      <button class="sub-btn" onclick="confirmSub()">Submit Exam →</button>
    </div>
  </div>
</div>

<!-- RESULT VIEW -->
<div class="view" id="vResult">
  <div class="rpage">
    <div class="rscore-area">
      <div class="score-ring-outer">
        <svg class="score-ring-svg" viewBox="0 0 180 180">
          <circle cx="90" cy="90" r="80" fill="none" stroke="#1a2236" stroke-width="12"/>
          <circle cx="90" cy="90" r="80" fill="none" id="ringArc"
            stroke="url(#rg)" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="502" stroke-dashoffset="502"/>
          <defs>
            <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#4f8ef7"/>
              <stop offset="100%" stop-color="#7c3aed"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="score-ring-inner">
          <div class="rpct" id="rPct">0%</div>
          <div class="rlabel">Score</div>
        </div>
      </div>
      <div class="rstatus" id="rStatus">—</div>
      <div class="rdetail" id="rDetail">—</div>
      <div class="grade-badge" id="rGrade">—</div>
    </div>

    <div class="rstats">
      <div class="rstat"><div class="rv" id="rsCorrect">0</div><div class="rl">Correct</div></div>
      <div class="rstat"><div class="rv" id="rsWrong">0</div><div class="rl">Wrong</div></div>
      <div class="rstat"><div class="rv" id="rsSkipped">0</div><div class="rl">Skipped</div></div>
      <div class="rstat"><div class="rv" id="rsTime">—</div><div class="rl">Time Taken</div></div>
    </div>

    <div class="bsection">
      <div class="bhead">
        <span>📋 Question-by-Question Review</span>
        <span class="bscore" id="bHeadScore">—</span>
      </div>
      <div id="bBody"></div>
    </div>

    <div class="raction">
      <button class="btn btn-g" onclick="backToList()" style="padding:12px 28px">← Back to Exams</button>
      <a href="/results.html" class="btn btn-p" style="padding:12px 28px;display:inline-block;text-decoration:none">View All Results</a>
    </div>
  </div>
</div>

<script>
const API='';
const token=localStorage.getItem('token');
const user=JSON.parse(localStorage.getItem('user')||'{}');
if(!token||user.role!=='student')window.location.href='/login.html';
document.getElementById('hName').textContent=user.name||'Student';
document.getElementById('hAv').textContent=(user.name||'S')[0].toUpperCase();
const H={'Content-Type':'application/json','Authorization':'Bearer '+token};

let exam=null,answers={},timer=null,startTime=null,attempted=new Set();

function logout(){localStorage.clear();window.location.href='/login.html'}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));document.getElementById(id).classList.add('on')}

// ── Load exam list ─────────────────────────────────────────
async function loadList(){
  const [eRes,rRes]=await Promise.all([fetch(`${API}/api/exams`,{headers:H}),fetch(`${API}/api/results/my`,{headers:H})]);
  const eData=await eRes.json();const rData=await rRes.json();
  attempted=new Set((rData.data||[]).map(r=>Number(r.exam_id)));
  const exams=eData.data||[];
  if(exams.length===0){document.getElementById('egrid').innerHTML='<p style="color:var(--muted);grid-column:1/-1">No exams available right now.</p>';return}
  document.getElementById('egrid').innerHTML=exams.map(e=>{
    const done=attempted.has(Number(e.id));
    return`<div class="ecard${done?' attempted':''}" ${done?'':` onclick="startExam(${e.id})"`}>
      <div class="etitle">${e.title}</div>
      <div class="edesc">${e.description||'No description.'}</div>
      <div class="emeta">
        <span class="tag">⏱ ${e.duration_mins} min</span>
        <span class="tag">❓ ${e.question_count} questions</span>
        <span class="tag">🏆 ${e.total_marks} marks</span>
        <span class="tag">✅ Pass: ${e.pass_percent}%</span>
      </div>
      ${done?'<div class="done-badge">✓ Already Attempted</div>':'<button class="start-btn">Start Exam →</button>'}
    </div>`}).join('');
}

// ── Start exam ─────────────────────────────────────────────
async function startExam(id){
  const r=await fetch(`${API}/api/exams/${id}`,{headers:H});
  const d=await r.json();
  if(!d.success){alert(d.message);return}
  exam=d.data;answers={};startTime=Date.now();
  document.getElementById('etname').textContent=exam.title;
  document.getElementById('etmeta').textContent=`${exam.questions.length} questions · ${exam.duration_mins} minutes`;
  document.getElementById('pTotal').textContent=exam.questions.length;
  document.getElementById('sTotal').textContent=exam.questions.length;
  renderQ(exam.questions);
  startTimer(exam.duration_mins*60);
  show('vExam');window.scrollTo(0,0);
}

function renderQ(qs){
  document.getElementById('qContainer').innerHTML=qs.map((q,i)=>`
    <div class="qblock" id="qb${q.id}">
      <div class="qnum">Question ${i+1} &nbsp;·&nbsp; ${q.marks} mark${q.marks>1?'s':''}</div>
      <div class="qtext">${q.question_text}</div>
      <div class="opts">
        ${['A','B','C','D'].map(o=>`
          <div class="opt" id="o${q.id}${o}" onclick="pick(${q.id},'${o}',this)">
            <div class="oletter">${o}</div>
            <span>${q['option_'+o.toLowerCase()]}</span>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

function pick(qid,opt,el){
  answers[qid]=opt;
  ['A','B','C','D'].forEach(o=>{const e=document.getElementById(`o${qid}${o}`);if(e)e.classList.remove('sel')});
  el.classList.add('sel');
  document.getElementById(`qb${qid}`).classList.add('answered');
  updateProg();
}

function updateProg(){
  const a=Object.keys(answers).length,t=exam.questions.length;
  document.getElementById('pAns').textContent=a;
  document.getElementById('sAns').textContent=a;
  document.getElementById('pFill').style.width=(t>0?a/t*100:0)+'%';
}

// ── Timer ──────────────────────────────────────────────────
function startTimer(secs){
  let s=secs;clearInterval(timer);updateTDisp(s);
  timer=setInterval(()=>{s--;updateTDisp(s);if(s<=0){clearInterval(timer);alert('⏰ Time up! Auto-submitting.');submitExam()}},1000);
}
function updateTDisp(s){
  const el=document.getElementById('timerDisp');
  el.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  el.className='tval'+(s<60?' crit':s<300?' warn':'');
}

// ── Submit ─────────────────────────────────────────────────
function confirmSub(){
  const un=exam.questions.length-Object.keys(answers).length;
  if(un>0&&!confirm(`${un} question(s) unanswered. Submit anyway?`))return;
  if(un===0&&!confirm('Submit exam? This cannot be undone.'))return;
  submitExam();
}

async function submitExam(){
  clearInterval(timer);
  const timeTaken=Math.round((Date.now()-startTime)/1000);
  try{
    const r=await fetch(`${API}/api/results/submit`,{method:'POST',headers:H,body:JSON.stringify({exam_id:exam.id,answers,time_taken:timeTaken})});
    const d=await r.json();
    if(!d.success){alert('Error: '+d.message);return}
    showResult(d.data,timeTaken);
  }catch(e){alert('Connection error. Check server.')}
}

// ── Show instant result ────────────────────────────────────
function showResult(data,timeTaken){
  const pct=data.percentage;
  const circumference=502;
  const offset=circumference-(pct/100*circumference);
  // Animate ring
  setTimeout(()=>{document.getElementById('ringArc').style.strokeDashoffset=offset},100);
  document.getElementById('rPct').textContent=pct+'%';
  document.getElementById('rStatus').textContent=data.passed?'🎉 Passed!':'😔 Failed';
  document.getElementById('rStatus').className='rstatus '+(data.passed?'pass':'fail');
  document.getElementById('rDetail').textContent=`You scored ${data.score} out of ${data.total_marks} marks.`;

  // Grade badge
  const g=data.grade||'F';
  document.getElementById('rGrade').textContent='Grade: '+g;
  document.getElementById('rGrade').className='grade-badge grade-'+g[0];

  // Stats
  const bd=data.breakdown||[];
  const correct=bd.filter(x=>x.is_correct).length;
  const skipped=bd.filter(x=>x.given===null).length;
  const wrong=bd.length-correct-skipped;
  document.getElementById('rsCorrect').textContent=correct;
  document.getElementById('rsWrong').textContent=wrong;
  document.getElementById('rsSkipped').textContent=skipped;
  const mm=Math.floor(timeTaken/60),ss=timeTaken%60;
  document.getElementById('rsTime').textContent=`${mm}m ${ss}s`;
  document.getElementById('bHeadScore').textContent=`${data.score}/${data.total_marks} marks`;

  // Full question breakdown
  document.getElementById('bBody').innerHTML=bd.map((q,i)=>{
    const opts=['A','B','C','D'];
    return`<div class="bitem">
      <div class="bitem-q"><strong>Q${i+1}.</strong> ${q.question_text}</div>
      <div class="bitem-opts">${opts.map(o=>{
        const txt=q['option_'+o.toLowerCase()];
        const isCorrect=o===q.correct;
        const isGiven=o===q.given;
        let cls='bopt';
        if(isCorrect)cls+=' correct';
        else if(isGiven&&!isCorrect)cls+=' wrong';
        else cls+=' neutral';
        const icon=isCorrect?'✓':isGiven?'✗':'';
        return`<div class="${cls}"><span class="bopt-letter">${o}.</span><span>${icon?icon+' ':''} ${txt}</span></div>`
      }).join('')}</div>
      <div class="bitem-verdict ${q.is_correct?'right':'wrong'}">
        ${q.is_correct
          ? `✅ Correct! +${q.marks_earned} mark${q.marks_earned!==1?'s':''}`
          : q.given
            ? `❌ Incorrect. You chose ${q.given}, correct is ${q.correct}. +0 marks`
            : `⚪ Skipped. Correct answer is ${q.correct}. +0 marks`}
      </div>
    </div>`}).join('');

  show('vResult');window.scrollTo(0,0);
}

function backToList(){exam=null;answers={};clearInterval(timer);loadList();show('vList')}
loadList();
</script>
</body>
</html>
